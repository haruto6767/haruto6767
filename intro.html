<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prologue - The Logic of Numbers</title>

    <link
        rel="stylesheet"
        href="css/story.css"
    >

</head>

<body>

<!-- BACKGROUND -->

<div id="background"></div>



<!-- HUD -->

<div id="gameHUD">

    <div id="chapterTitle">

        PROLOGUE

        <span>THE BEGINNING</span>

    </div>


    <button
        id="menuButton"
        type="button">

        ☰ MENU

    </button>

</div>


<!-- CHARACTER -->

<div id="characterLeft">

    <img
        id="leftSprite"
        src=""
        alt="Character"
    >

</div>


<!-- DIALOGUE -->

<div id="dialogueContainer">

    <div id="speakerName"></div>

    <div id="dialogueText"></div>


    <button
        id="nextButton"
        type="button">

        NEXT ▶

    </button>

</div>


<!-- GAME MENU -->

<div
    id="gameMenu"
    class="hidden">

    <div id="gameMenuBox">

        <h1>GAME MENU</h1>


        <button
            id="saveButton"
            type="button">

            SAVE PROGRESS

        </button>


        <button
            id="bgmButton"
            type="button">

            BGM: ON

        </button>


        <label>
            BGM VOLUME
        </label>


        <input
            type="range"
            id="bgmVolume"
            min="0"
            max="1"
            step="0.1"
            value="0.5"
        >


        <button
            id="closeMenuButton"
            type="button">

            BACK TO GAME

        </button>


        <button
            id="mainMenuButton"
            type="button">

            MAIN MENU

        </button>

    </div>

</div>


<!-- INTRO RESULT -->

<!-- INTRO RESULT -->

<div
    id="introEndScreen"
    style="display:none;">

    <div id="introEndContent">

        <h1>THE ADVENTURE BEGINS</h1>

        <p>
            The gates of the metaverse are waiting.
        </p>

        <div id="introEndButtons">

            <a
                id="startChapterButton"
                href="chapter/chapter1.html">

                ENTER LEVEL 1 ▶

            </a>

            <button
                id="introExitButton"
                type="button">

                MAIN MENU

            </button>

        </div>

    </div>

</div>


<script src="intro.js"></script>

</body>

</html>
