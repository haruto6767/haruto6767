<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Logic of Numbers</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="overlay"></div>

<div class="menu">

    <h1>THE LOGIC OF NUMBERS</h1>

    <p class="subtitle">
        A Discrete Structure Adventure
    </p>

    <button onclick="startGame()">
        START GAME
    </button>

    <button onclick="settings()">
        SETTINGS
    </button>

    <button onclick="exitGame()">
        EXIT
    </button>

</div>


<!-- BGM ICON -->

<button
    id="bgmIcon"
    class="bgm-icon"
    title="Toggle BGM"
    aria-label="Toggle BGM">

    🔊

</button>


<!-- SETTINGS -->

<div id="settingsPopup"
     class="popup">

    <div class="popup-content">

        <h2>SETTINGS</h2>

        <label>
            BGM Volume
        </label>

        <input
            type="range"
            id="volumeSlider"
            min="0"
            max="1"
            step="0.1"
        >

        <br><br>

        <button onclick="closeSettings()">
            CLOSE
        </button>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
